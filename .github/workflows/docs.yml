name: docs

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      # -W turns warnings into errors: the docs build clean today and should stay that way.
      - run: sphinx-build -b html -W docs docs/_build/html
